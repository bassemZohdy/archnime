  @media (prefers-color-scheme: dark) {

  * { box-sizing: border-box; scrollbar-color: var(--muted) var(--line); scrollbar-width: thin; }

  html, body { width: 100%; min-width: 0; margin: 0; overflow-x: hidden; background: var(--bg); color: var(--ink); font-family: var(--font); }

  .controls { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; padding: 10px 12px; border-top: 1px solid var(--line); }

  .flow-timeline { display: flex; align-items: center; gap: 5px; flex-wrap: wrap; padding: 8px 12px 10px; border-top: 1px solid var(--line); }

  .perspective-tools select { max-width: 150px; padding: 5px 8px; border: 1px solid var(--line); border-radius: 8px; background: var(--bg); color: var(--ink); font: inherit; font-size: 12px; }
  .panel-toggle { white-space: nowrap; }
  body.panel-hidden main.layout { grid-template-columns: minmax(0, 1fr); }
  body.panel-hidden aside.panel { display: none; }
  .menu { position: relative; }

  .menu > summary { list-style: none; cursor: pointer; font: inherit; font-size: 13px; padding: 6px 10px; border: 1px solid var(--line); border-radius: 8px; background: var(--bg); color: var(--ink); user-select: none; }
  .menu > summary::-webkit-details-marker { display: none; }
  .menu > summary:hover, .menu[open] > summary { border-color: var(--data); }
  .menu-panel { position: absolute; right: 0; bottom: calc(100% + 6px); z-index: 20; display: flex; flex-direction: column; gap: 2px; padding: 6px; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; box-shadow: 0 8px 24px rgb(20 30 50 / 18%); min-width: 168px; }
  .menu-panel button { text-align: left; }
  .view-tools[hidden] { display: none; }

  .tune-tools { display: flex; align-items: center; gap: 6px; color: var(--muted); font-size: 11px; }
  .tune-tools select { max-width: 150px; padding: 5px 8px; border: 1px solid var(--line); border-radius: 8px; background: var(--bg); color: var(--ink); font: inherit; font-size: 12px; }
  .tune-preserve { display: inline-flex; align-items: center; gap: 4px; white-space: nowrap; }
  .view-tools { display: flex; align-items: center; gap: 6px; }
  .view-tools label { color: var(--muted); font-size: 11px; font-weight: 650; letter-spacing: .04em; text-transform: uppercase; }
  .view-tools select { max-width: 190px; padding: 5px 8px; border: 1px solid var(--line); border-radius: 8px; background: var(--bg); color: var(--ink); font: inherit; font-size: 12px; }
  .search-tools { display: flex; gap: 6px; align-items: center; }
  .search-tools input { width: 150px; }

  .progress > div { height: 100%; background: var(--data); }
  aside.panel { display: flex; flex-direction: column; gap: 14px; }

  .card h2 { margin: 0 0 6px; font-size: 16px; font-weight: 650; }
  .card .eyebrow { font-size: 11px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); margin-bottom: 6px; }
  .card p { margin: 0 0 10px; font-size: 13.5px; line-height: 1.5; }
  .card ul { margin: 0 0 10px; padding-left: 18px; font-size: 13px; line-height: 1.5; }
  .card li { margin: 2px 0; }

  .stage-links { display: flex; flex-wrap: wrap; gap: 8px 12px; margin-top: 10px; font-size: 12px; }

  .legend h3 { margin: 0 0 8px; font-size: 13px; font-weight: 650; }

  .legend li { display: flex; align-items: center; gap: 10px; font-size: 12.5px; }
  .legend svg { flex: none; width: 44px; height: 22px; overflow: visible; }
  .notice { display: none; padding: 24px; color: var(--muted); font-size: 14px; }
  .no-d3 .notice { display: block; }
  .no-d3 .scroller, .no-d3 .controls { display: none; }
  .status { color: var(--muted); font-size: 11px; min-height: 1em; }

  /* Fixed shared visual language. Change tokens in architecture-library.js, not per diagram. */
  .node .shape { fill: var(--existing-fill); stroke: var(--existing); stroke-width: 1.6; transition: fill .5s, stroke .5s, opacity .5s, stroke-dasharray .5s; }
  .node .icon { fill: none; stroke: currentColor; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; pointer-events: none; }
  .node text { font-family: var(--font); fill: var(--ink); pointer-events: none; }
  .node text.label { font-size: var(--diagram-label-font); font-weight: 600; }
  .node text.detail { font-size: var(--diagram-detail-font); fill: var(--muted); }
  .node .accent { transition: opacity .5s; opacity: 0; }
  .kind-existing .shape { fill: var(--existing-fill); stroke: var(--existing); }
  .kind-new .shape { fill: var(--data-fill); stroke: var(--data); }
  .kind-mixed .shape { fill: var(--existing-fill); stroke: var(--data); }
  .kind-mixed .accent { opacity: 1; fill: var(--data); }
  .kind-security .shape { fill: var(--security-fill); stroke: var(--security); }
  .kind-retired .shape { fill: var(--retired-fill); stroke: var(--retired); stroke-dasharray: 5 4; }
  .kind-retired text { fill: var(--retired); }
  .node.changed { filter: drop-shadow(0 0 5px var(--glow)) drop-shadow(0 0 1.5px var(--glow)); }
  .node.search-hit { filter: drop-shadow(0 0 7px var(--data)) drop-shadow(0 0 2px var(--data)); }
  .focus-hidden { display: none !important; }
  .node.search-dim, .wire.search-dim, .wire-label.search-dim { opacity: .16 !important; }
  .node.perspective-dim { opacity: .24 !important; }
  .node.perspective-boundary .shape { stroke: var(--boundary); stroke-width: 2.4; }
  .node.perspective-ops .shape { stroke: var(--control); stroke-width: 2.4; }
  .wire.perspective-hidden, .wire-label.perspective-hidden { display: none; }
  .wire.perspective-ops .main { stroke-width: 3.1px; }
  /* Perspective emphasis must never change text weight or size: layout reserved
     space for the measured weights, and a perspective restyles without relayout. */
  .wire-label.perspective-ops { text-decoration: underline; text-underline-offset: 2px; }
  .boundary.perspective-emphasis rect { stroke-width: 2.4; }
  .boundary.perspective-emphasis text { fill: var(--ink); }
  .bchip.perspective-emphasis rect { stroke-width: 2; }
  .node { cursor: pointer; transition: filter .5s, opacity .3s; }
  .package-outline rect { fill: color-mix(in srgb, var(--data) 4%, transparent); stroke: var(--data); stroke-width: 1.2; stroke-dasharray: 5 5; }
  .package-outline text { fill: var(--data-label); font-size: var(--diagram-package-font); font-weight: 650; }
  .package-outline.deployment-infra rect { fill: color-mix(in srgb, var(--control) 5%, transparent); stroke: var(--control); stroke-dasharray: 3 4; }
  .package-outline.deployment-infra text { fill: var(--control); }
  .package-outline.perspective-ops rect { stroke: var(--control); stroke-width: 2.4; }
  .package-hit { cursor: pointer; }
  .package-hit rect { fill: transparent; stroke: transparent; pointer-events: all; }
  .package-hit path { fill: none; stroke: transparent; stroke-width: 14; pointer-events: stroke; }
  .package-hit:focus { outline: none; }
  .package-hit:focus rect, .package-hit:focus path { stroke: var(--control); stroke-width: 2; stroke-dasharray: 2 3; }
  .wire .main { fill: none; transition: stroke .5s, d .5s, opacity .5s; }
  .wire.flow-inactive .main, .wire-label.flow-inactive { opacity: .2; }
  .wire.flow-active .main { filter: drop-shadow(0 0 3px var(--glow)); }
  .flow-marker { pointer-events: none; }
  .flow-marker rect { fill: var(--panel); stroke: var(--data); stroke-width: 1.4; }
  .flow-marker text { fill: var(--data-label); font: 700 10px var(--font); }
  .wire.flow-return .main { stroke-dasharray: 9 6; }
  .wire.flow-return .flow { stroke-dasharray: 3 8; }
  .wire.flow-parallel .main { stroke-width: 3.1px; }
  .wire.flow-loop .main { stroke-dasharray: 4 5; }
  .flow-decoration { pointer-events: none; }
  .flow-decoration.fork circle, .flow-decoration.join circle { fill: var(--panel); stroke: var(--control); stroke-width: 1.8; }
  .flow-decoration.fork text, .flow-decoration.join text { fill: var(--control); font: 800 12px var(--font); }
  .flow-loop-badge rect { fill: var(--panel); stroke: var(--data); stroke-width: 1.2; }
  .flow-loop-badge text { fill: var(--data-label); font: 700 10px var(--font); }
  .wire .flow { fill: none; stroke-linecap: round; pointer-events: none; opacity: .9; animation: flow 1.2s linear infinite; animation-delay: var(--flow-delay, 0s); }
  .wire.secondary .main { opacity: .62; }
  .wire.secondary .flow { opacity: .35; }
  .wire.type-data .main { stroke: var(--data); stroke-width: 2.6; }
  .wire.type-data .flow { stroke: var(--data); stroke-width: 2.4; stroke-dasharray: 2 10; }
  .wire.type-security .main { stroke: var(--security); stroke-width: 2.2; stroke-dasharray: 8 5; }
  .wire.type-security .flow { stroke: var(--security); stroke-width: 2; stroke-dasharray: 2 8; }
  .wire.type-control .main { stroke: var(--control); stroke-width: 2.2; stroke-dasharray: 3 5; }
  .wire.type-control .flow { stroke: var(--control); stroke-width: 2; stroke-dasharray: 2 8; }
  .wire.type-neutral .main { stroke: var(--neutral); stroke-width: 1.6; }
  .wire.type-compat .main { stroke: var(--existing); stroke-width: 2.2; stroke-dasharray: 10 6; }
  .arrow-data { fill: var(--data); } .arrow-security { fill: var(--security); } .arrow-control { fill: var(--control); } .arrow-neutral { fill: var(--neutral); } .arrow-compat { fill: var(--existing); }
  @keyframes flow { to { stroke-dashoffset: -24; } }
  @media (prefers-reduced-motion: reduce) { .wire .flow { animation: none; display: none; } .node, .node .shape, .node .accent, .wire .main, .progress > div { transition: none; } }
  /* An atomic commit (wire-style switch) must not morph the previous route. */
  .instant-commit .wire .main, .instant-commit .node, .instant-commit .node .shape, .instant-commit .node .accent { transition: none !important; }
  .wire-label { font-family: var(--font); font-size: var(--diagram-wire-font); font-weight: 500; paint-order: stroke; stroke: var(--panel); stroke-width: 4px; stroke-linejoin: round; pointer-events: none; }
  .wire-label.secondary { opacity: .74; }
  .wire-label.type-data { fill: var(--data-label); } .wire-label.type-security { fill: var(--security-label); }
  .wire-label.type-control { fill: var(--control-label); } .wire-label.type-compat { fill: var(--existing-label); } .wire-label.type-neutral { fill: var(--neutral-label); }
  .boundary rect { fill: var(--boundary-fill); stroke: var(--boundary); stroke-width: 1.2; stroke-dasharray: 6 5; }
  .boundary text { font-family: var(--font); font-size: var(--diagram-boundary-font); font-weight: 650; fill: var(--boundary); letter-spacing: .02em; }
  .boundary.tone-security rect { stroke: var(--security); fill: color-mix(in srgb, var(--security) 5%, transparent); }
  .boundary.tone-security text { fill: var(--security); }
  .bchip { pointer-events: none; }
  .bchip rect { fill: color-mix(in srgb, var(--boundary) 14%, var(--panel)); stroke: var(--boundary); stroke-width: 1; stroke-dasharray: 4 3; }
  .bchip text { font-family: var(--font); font-size: 10px; font-weight: 650; fill: var(--boundary); letter-spacing: .02em; }
  .bchip.tone-security rect { fill: color-mix(in srgb, var(--security) 14%, var(--panel)); stroke: var(--security); }
  .bchip.tone-security text { fill: var(--security); }
  body.presenter .bchip text { font-size: 12px; }
  body.presenter .node text.label { font-size: 16px; } body.presenter .node text.detail { font-size: 13px; }
  body.presenter .wire-label { font-size: 13px; stroke-width: 5px; } body.presenter .hint, body.presenter .search-tools { display: none; }
  body.presenter .card:not(.legend), body.presenter .breadcrumbs { display: none; }
  @media print { .controls, .breadcrumbs, aside.panel, .progress { display: none !important; } main.layout { display: block; padding: 0; } .canvas-wrap { border: 0; } svg#diagram { width: 100%; min-width: 0; } .node text.label { font-size: 16px; } .node text.detail, .wire-label { font-size: 13px; } }
  @media (max-width: 720px) {
    header.top { align-items: flex-start; flex-direction: column; gap: 6px; padding: 14px 14px 8px; }
    header.top h1 { font-size: 18px; }
    .stage-indicator { white-space: normal; }
    .breadcrumbs { padding: 0 14px 10px; overflow-wrap: anywhere; }
    main.layout { display: flex; flex-direction: column; gap: 12px; padding: 0 12px max(16px, env(safe-area-inset-bottom)); }
    .canvas-wrap { border-radius: 10px; }
    .scroller { min-height: 0; max-height: none; }
    svg#diagram { width: max(100%, var(--diagram-min-width, 720px)); min-width: var(--diagram-min-width, 720px); max-height: none; }
    .controls { align-items: stretch; gap: 8px; padding: 10px; }
    .controls button, .search-tools input { min-height: 44px; padding: 10px 12px; }
    .controls .pills button { min-width: 44px; padding: 10px; }
    .controls .spacer { display: none; }
    .search-tools { flex: 1 1 100%; order: 10; }
    .search-tools input { flex: 1 1 auto; width: auto; min-width: 0; }
    .controls .hint { flex: 1 0 100%; line-height: 1.4; }
    .perspective-tools { flex: 1 1 100%; }
    aside.panel { gap: 12px; }
    .card { padding: 14px; }
  }
