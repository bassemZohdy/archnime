dsl: transition-diagram/2.0
meta:
  title: Infrastructure cycle
catalog:
  web: { label: Web, type: actor }
  api: { label: API, type: service }
  db: { label: Database, type: database }
views:
  - id: production
    mode: deployment
    title: Production
    nodes: [web, api]
    wires: ["web -> api"]
    deployment:
      infrastructure:
        loop-a: { label: Loop A, kind: cluster, children: [loop-b] }
        loop-b: { label: Loop B, kind: cluster, children: [loop-a] }
        host: { label: Host, kind: host }
      placements:
        - { component: web, target: host }
        - { component: api, target: host }
