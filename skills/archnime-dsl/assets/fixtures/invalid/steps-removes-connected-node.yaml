dsl: transition-diagram/1.0
meta: { title: Remove connected node }
catalog:
  client: { label: Client, type: actor }
  gateway: { label: Gateway, type: gateway }
steps:
  base:
    id: current
    title: Current state
    nodes: [client, gateway]
    wires:
      - "client => gateway: HTTPS"
  sequence:
    - id: remove-gateway
      title: Remove gateway
      remove:
        nodes: [gateway]
      changed: [gateway]
