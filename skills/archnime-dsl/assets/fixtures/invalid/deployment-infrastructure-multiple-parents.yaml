dsl: transition-diagram/2.0
meta:
  title: Multiple parents
catalog:
  web: { label: Web, type: actor }
  api: { label: API, type: service }
  db: { label: Database, type: database }
views:
  - id: production
    mode: deployment
    title: Production
    nodes: [web, api]
    wires: ["web -> api"]
    deployment:
      infrastructure:
        zone-a: { label: Zone A, kind: cluster, children: [host] }
        zone-b: { label: Zone B, kind: cluster, children: [host] }
        host: { label: Host, kind: host }
      placements:
        - { component: web, target: host }
        - { component: api, target: host }
